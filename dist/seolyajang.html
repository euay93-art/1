<title>설야장 살인사건</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* ============================================================
   설야장 살인사건 — 스타일
   눈 내리는 밤, 낡은 산장, 금색 등불.
   ============================================================ */

:root {
  --bg:        #0b1220;
  --bg-2:      #111b2e;
  --panel:     #16223a;
  --panel-2:   #1c2b48;
  --line:      #2a3c5e;
  --ink:       #e8eef8;
  --ink-dim:   #93a5c2;
  --ink-faint: #64789a;
  --gold:      #c9a227;
  --gold-soft: #e8c65c;
  --blood:     #a63d3d;
  --snow:      #dce8fa;
  --radius: 12px;
  --display: "Nanum Myeongjo", "Apple SD Gothic Neo", "Noto Serif KR", serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

/* display:flex/grid 가 hidden 속성을 덮어쓰지 않도록 */
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}

body {
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2947 0%, transparent 60%),
    linear-gradient(180deg, #0b1220 0%, #080e18 100%);
  background-attachment: fixed;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

b { color: var(--gold-soft); font-weight: 600; }
i { color: var(--ink-dim); }

/* ── 눈 ──────────────────────────────────────────────── */
.snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.snow span {
  position: absolute; top: -10px;
  color: var(--snow); opacity: .5;
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translateY(105vh) translateX(var(--drift, 20px)) rotate(180deg); }
}
@media (prefers-reduced-motion: reduce) { .snow { display: none; } }

/* ── 화면 전환 ───────────────────────────────────────── */
.screen { display: none; position: relative; z-index: 1; min-height: 100vh; }
.screen.active { display: block; animation: fadein .45s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── 버튼 ────────────────────────────────────────────── */
.btn {
  font: inherit; cursor: pointer;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--ink);
  padding: 10px 18px;
  transition: .15s;
}
.btn:hover { border-color: var(--gold); color: var(--gold-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, #d4ac2d, #a8851b);
  border-color: #d4ac2d; color: #1a1305; font-weight: 700;
}
.btn-primary:hover { filter: brightness(1.12); color: #1a1305; }
.btn-ghost { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-accuse { border-color: var(--blood); color: #e59a9a; }
.btn-accuse:hover { background: var(--blood); color: #fff; }
.btn-evidence { padding: 10px 13px; font-size: 17px; }

.back-link {
  background: none; border: 0; color: var(--ink-dim);
  font: inherit; cursor: pointer; padding: 4px 0; margin-bottom: 8px;
}
.back-link:hover { color: var(--gold-soft); }

/* ── 타이틀 ──────────────────────────────────────────── */
.title-wrap {
  max-width: 640px; margin: 0 auto;
  padding: 16vh 20px 60px; text-align: center;
}
.title-mark {
  font-family: var(--display);
  color: var(--gold); letter-spacing: .5em; font-size: 14px;
  margin-bottom: 20px; opacity: .8;
}
.title-wrap h1 {
  font-family: var(--display);
  font-size: clamp(30px, 8vw, 46px); margin: 0;
  letter-spacing: .04em; font-weight: 700;
}
.title-sub { color: var(--ink-dim); margin: 10px 0 0; font-size: 14px; letter-spacing: .2em; }
.title-line {
  width: 70px; height: 1px; margin: 28px auto;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.title-blurb { color: var(--ink-dim); font-size: 14.5px; }
.title-btns { margin-top: 36px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.ai-status {
  margin-top: 28px; font-size: 12.5px; color: var(--ink-faint);
  border-top: 1px solid var(--line); padding-top: 16px;
}
.ai-status.ok { color: #7fc9a0; }
.ai-status.off { color: var(--ink-faint); }

/* ── 프롤로그 ────────────────────────────────────────── */
.prologue-wrap {
  max-width: 620px; margin: 0 auto;
  padding: 18vh 20px 40px;
}
.prologue-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 30px 26px;
  border-left: 3px solid var(--gold);
}
.prologue-card h2 {
  font-family: var(--display); margin: 0 0 14px; font-size: 15px; color: var(--gold); letter-spacing: .1em; font-weight: 600; }
.prologue-card p { margin: 0; font-size: 16px; line-height: 1.95; }
.prologue-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
.prologue-dots { color: var(--ink-faint); letter-spacing: .35em; font-size: 12px; }

/* ── HUD ─────────────────────────────────────────────── */
.hud {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 12px 18px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: rgba(11,18,32,.93);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.hud-left, .hud-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud-title { color: var(--gold); letter-spacing: .2em; font-size: 13px; }
.hud-clock { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 700; }
.hud-deadline, .hud-count { font-size: 12.5px; color: var(--ink-dim); }
.hud-deadline.urgent { color: #e59a9a; }

/* ── 탭 ──────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 6px; padding: 12px 18px 0;
  max-width: 1000px; margin: 0 auto; flex-wrap: wrap;
}
.tab {
  flex: 1 1 120px;
  font: inherit; cursor: pointer;
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--line); border-bottom: none;
  border-radius: 10px 10px 0 0; padding: 10px 14px;
}
.tab.active { background: var(--panel); color: var(--gold-soft); border-color: var(--gold); }

.panels { max-width: 1000px; margin: 0 auto; padding: 0 18px 60px; }
.panel { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); padding: 22px; }
.panel.active { display: block; }

/* ── 장소 ────────────────────────────────────────────── */
.loc-grid, .sus-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
}
.loc-card, .sus-card {
  text-align: left; font: inherit; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; color: var(--ink);
  transition: .15s;
}
.loc-card:hover, .sus-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.loc-icon { font-size: 24px; display: block; margin-bottom: 6px; }
.loc-card b { display: block; color: var(--ink); font-size: 15.5px; }
.loc-prog { font-size: 12px; color: var(--ink-faint); margin-top: 6px; display: block; }
.loc-prog.done { color: #7fc9a0; }

.loc-detail h2 {
  font-family: var(--display); margin: 6px 0 4px; font-size: 21px; }
.loc-desc { color: var(--ink-dim); margin: 0 0 20px; font-size: 14px; }

/* ── 단서 ────────────────────────────────────────────── */
.clue-list { display: flex; flex-direction: column; gap: 10px; }
.clue {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px;
}
.clue.locked { opacity: .55; }
.clue.key { border-left: 3px solid var(--gold); }
.clue-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clue-head b { color: var(--ink); font-size: 15px; }
.clue-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--ink-faint);
}
.clue-tag.결정적 { border-color: var(--gold); color: var(--gold-soft); }
.clue-tag.흉기, .clue-tag.동기 { border-color: var(--blood); color: #e59a9a; }
.clue-text { margin: 10px 0 0; font-size: 14.2px; color: var(--ink-dim); }
.clue-text b { color: var(--gold-soft); }
.clue-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; }
.clue-undiscovered { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.clue-undiscovered span { color: var(--ink-faint); font-size: 14px; }

/* ── 용의자 ──────────────────────────────────────────── */
.sus-card { display: flex; gap: 14px; align-items: flex-start; }
.sus-face { font-size: 30px; line-height: 1; }
.sus-card b { display: block; font-size: 16px; }
.sus-card small { color: var(--ink-faint); font-size: 12.5px; display: block; margin-top: 2px; }
.sus-meta { font-size: 12px; color: var(--ink-dim); margin-top: 8px; }

/* ── 채팅 ────────────────────────────────────────────── */
.chat-head { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 14px; }
.chat-who { display: flex; gap: 12px; align-items: center; }
.chat-face { font-size: 28px; }
.chat-who b { font-size: 17px; }
.chat-who small { display: block; color: var(--ink-faint); font-size: 12.5px; }

.chat-log {
  min-height: 260px; max-height: 50vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding: 4px 4px 12px;
}
.msg { max-width: 82%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.8; }
.msg.me { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; background: #1b2942; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.evidence {
  align-self: center; max-width: 100%;
  background: transparent; border: 1px dashed var(--gold);
  color: var(--gold-soft); font-size: 13px; text-align: center;
}
.msg.system { align-self: center; color: var(--ink-faint); font-size: 12.5px; background: none; }
.msg.confess { border-color: var(--blood); background: #2a1620; }
.msg.thinking { color: var(--ink-faint); font-style: italic; }

.chat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip {
  font: inherit; font-size: 12.5px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
  color: var(--ink-dim); border-radius: 99px; padding: 5px 12px;
}
.chip:hover { border-color: var(--gold); color: var(--gold-soft); }

.chat-input { display: flex; gap: 8px; align-items: center; }
.chat-input input {
  flex: 1; min-width: 0; font: inherit;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 11px 14px;
}
.chat-input input:focus { outline: none; border-color: var(--gold); }

/* ── 수첩 ────────────────────────────────────────────── */
.nb-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.nb-tab {
  font: inherit; font-size: 13px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
  color: var(--ink-dim); border-radius: 99px; padding: 6px 16px;
}
.nb-tab.active { border-color: var(--gold); color: var(--gold-soft); }
.nb-group { margin-bottom: 26px; }
.nb-group h3 { font-size: 13px; color: var(--gold); letter-spacing: .1em; margin: 0 0 10px; }
.nb-empty { color: var(--ink-faint); font-size: 14px; }
.tl-row { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tl-time { color: var(--gold-soft); font-variant-numeric: tabular-nums; min-width: 92px; }
.tl-what { color: var(--ink-dim); }

/* ── 최종 추리 ───────────────────────────────────────── */
.accuse-wrap, .ending-wrap { max-width: 720px; margin: 0 auto; padding: 60px 20px 80px; }
.accuse-wrap h2 {
  font-family: var(--display); font-size: 26px; margin: 0 0 8px; }
.accuse-lead { color: var(--ink-dim); margin: 0 0 30px; font-size: 14px; }
.quiz {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.quiz h3 { margin: 0 0 14px; font-size: 16px; }
.quiz label {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14.5px;
}
.quiz label:hover { background: var(--panel-2); }
.quiz input { margin-top: 6px; accent-color: var(--gold); flex-shrink: 0; }
.accuse-btns, .ending-btns, .title-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.accuse-btns { justify-content: space-between; margin-top: 24px; }
.ending-btns { justify-content: center; margin-top: 40px; }

/* ── 엔딩 ────────────────────────────────────────────── */
.rank-card {
  text-align: center; padding: 34px 20px;
  background: var(--panel); border: 1px solid var(--gold);
  border-radius: var(--radius); margin-bottom: 30px;
}
.rank-grade {
  font-family: var(--display); font-size: 62px; font-weight: 800; color: var(--gold); line-height: 1; }
.rank-title {
  font-family: var(--display); font-size: 21px; margin-top: 8px; }
.rank-score { color: var(--ink-faint); font-size: 13px; margin-top: 6px; }
.rank-line { color: var(--ink-dim); margin: 18px auto 0; max-width: 460px; font-size: 14.5px; }

.mark { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14.2px; }
.mark-icon { flex-shrink: 0; font-size: 17px; }
.mark-q { color: var(--ink-dim); font-size: 13px; }
.mark-a { margin-top: 3px; }
.mark-a.wrong { color: #e59a9a; }
.mark-exp { color: var(--ink-faint); font-size: 13.2px; margin-top: 6px; }

.solution-head {
  font-family: var(--display); margin: 46px 0 18px; font-size: 22px; color: var(--gold); }
.sol-block { margin-bottom: 26px; }
.sol-block h3 {
  font-family: var(--display); font-size: 15px; margin: 0 0 8px; color: var(--gold-soft); }
.sol-block p { margin: 0; color: var(--ink-dim); font-size: 14.5px; line-height: 1.95; }

/* ── 모달 / 토스트 ───────────────────────────────────── */
.modal {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(4,8,16,.82); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-box {
  background: var(--panel); border: 1px solid var(--gold);
  border-radius: var(--radius); padding: 24px;
  width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
}
.modal-box h3 { margin: 0 0 16px; font-size: 17px; }
.modal-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.modal-item {
  text-align: left; font: inherit; cursor: pointer; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 11px 14px; font-size: 14px;
}
.modal-item:hover { border-color: var(--gold); }
.modal-item small { display: block; color: var(--ink-faint); font-size: 12.5px; margin-top: 3px; }

.toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
  z-index: 95; max-width: 90vw;
  background: var(--panel); border: 1px solid var(--gold); color: var(--gold-soft);
  border-radius: 99px; padding: 11px 22px; font-size: 14px;
  animation: fadein .25s ease;
}

@media (max-width: 560px) {
  .panels { padding: 0 12px 50px; }
  .panel { padding: 16px; }
  .tabs { padding: 10px 12px 0; flex-wrap: nowrap; gap: 4px; }
  .tab { flex: 1 1 0; min-width: 0; padding: 9px 4px; font-size: 12.5px; }
  .hud { padding: 10px 12px; }
  .msg { max-width: 92%; }
  .loc-grid, .sus-grid { grid-template-columns: 1fr; }
}

/* 단일 파일 빌드: 게임이 화면 전체를 쓴다 */
html, body { height: 100%; }
</style>

<div class="snow" id="snow" aria-hidden="true"></div>

<!-- ── 타이틀 ───────────────────────────────────────────── -->
<section class="screen active" id="screen-title">
  <div class="title-wrap">
    <div class="title-mark">雪 夜 莊</div>
    <h1>설야장 살인사건</h1>
    <p class="title-sub">폭설의 밤, 여섯 사람</p>
    <div class="title-line"></div>
    <p class="title-blurb">
      강원도 평창, 눈에 갇힌 아트 레지던시.<br>
      거장 윤제하가 2층 작업실에서 살해당했다.<br>
      경찰이 오기까지 일곱 시간 반. 범인은 아직 이 안에 있다.
    </p>
    <div class="title-btns">
      <button class="btn btn-primary" id="btn-start">조사를 시작한다</button>
      <button class="btn btn-ghost" id="btn-continue" hidden>이어서 하기</button>
    </div>
    <div class="ai-status" id="ai-status">용의자 AI 연결 확인 중…</div>
  </div>
</section>

<!-- ── 프롤로그 ─────────────────────────────────────────── -->
<section class="screen" id="screen-prologue">
  <div class="prologue-wrap">
    <div class="prologue-card" id="prologue-card">
      <h2 id="prologue-head"></h2>
      <p id="prologue-body"></p>
    </div>
    <div class="prologue-nav">
      <span class="prologue-dots" id="prologue-dots"></span>
      <button class="btn btn-primary" id="btn-prologue-next">다음</button>
    </div>
  </div>
</section>

<!-- ── 본편 ─────────────────────────────────────────────── -->
<section class="screen" id="screen-game">
  <header class="hud">
    <div class="hud-left">
      <span class="hud-title">설야장</span>
      <span class="hud-clock" id="hud-clock">07:30</span>
      <span class="hud-deadline" id="hud-deadline">경찰 도착까지 7시간 30분</span>
    </div>
    <div class="hud-right">
      <span class="hud-count" id="hud-count">증거 0 / 28</span>
      <button class="btn btn-small btn-accuse" id="btn-goto-accuse">최종 추리</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="investigate">🔦 현장 조사</button>
    <button class="tab" data-tab="interrogate">💬 심문</button>
    <button class="tab" data-tab="notebook">📕 사건 수첩</button>
  </nav>

  <main class="panels">
    <!-- 현장 조사 -->
    <div class="panel active" id="panel-investigate">
      <div class="loc-grid" id="loc-grid"></div>
      <div class="loc-detail" id="loc-detail" hidden>
        <button class="back-link" id="btn-loc-back">← 장소 목록</button>
        <h2 id="loc-name"></h2>
        <p class="loc-desc" id="loc-desc"></p>
        <div class="clue-list" id="clue-list"></div>
      </div>
    </div>

    <!-- 심문 -->
    <div class="panel" id="panel-interrogate">
      <div class="sus-grid" id="sus-grid"></div>
      <div class="chat-wrap" id="chat-wrap" hidden>
        <div class="chat-head">
          <button class="back-link" id="btn-chat-back">← 용의자 목록</button>
          <div class="chat-who">
            <span class="chat-face" id="chat-face"></span>
            <span>
              <b id="chat-name"></b>
              <small id="chat-role"></small>
            </span>
          </div>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-chips" id="chat-chips"></div>
        <div class="chat-input">
          <button class="btn btn-evidence" id="btn-show-evidence" title="증거 제시">📎</button>
          <input type="text" id="chat-text" placeholder="무엇이든 물어보십시오…" autocomplete="off">
          <button class="btn btn-primary" id="btn-chat-send">묻기</button>
        </div>
      </div>
    </div>

    <!-- 수첩 -->
    <div class="panel" id="panel-notebook">
      <div class="nb-tabs">
        <button class="nb-tab active" data-nb="evidence">증거</button>
        <button class="nb-tab" data-nb="people">인물</button>
        <button class="nb-tab" data-nb="time">타임라인</button>
      </div>
      <div class="nb-body" id="nb-body"></div>
    </div>
  </main>
</section>

<!-- ── 최종 추리 ────────────────────────────────────────── -->

    if (c.isCulprit) {

    }

    return `${c.sheet}\n\n${CANON_PUBLIC}\n\n${COMMON_RULES}${extra}`;
};

const SAVE_KEY = "seolyajang.save.v1";

const State = {
    started: false,
    minute: CASE.meta.startMinute,
    found: [],          // 발견한 증거 id
    presented: {},       // 용의자별로 제시한 증거 id 배열
    chats: {},           // 용의자별 대화 기록 [{role,text}]
    asked: [],           // 오프라인 모드에서 소비한 질문 id
    confessed: false,    // 배정훈이 자백했는가
    answers: {},         // 최종 추리 선택
    finished: false,

    has(id) { return this.found.includes(id); },

    canFind(id) {
        const c = CASE.clues[id];
        if (!c || !c.requires) return true;
        return c.requires.every(r => this.has(r));
    },

    find(id) {
        if (this.has(id)) return false;
        this.found.push(id);
        this.spend();
        this.save();
        return true;
    },

    presentedFor(sid) { return this.presented[sid] || (this.presented[sid] = []); },

    present(sid, cid) {
        const list = this.presentedFor(sid);
        if (!list.includes(cid)) list.push(cid);
        this.save();
    },

    chatFor(sid) { return this.chats[sid] || (this.chats[sid] = []); },

    spend(n) {
        this.minute += (n === undefined ? CASE.meta.actionCost : n);
        if (this.minute > CASE.meta.endMinute) this.minute = CASE.meta.endMinute;
    },

    timeUp() { return this.minute >= CASE.meta.endMinute; },

    clock() {
        const h = Math.floor(this.minute / 60), m = this.minute % 60;
        return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    },

    remainText() {
        const left = CASE.meta.endMinute - this.minute;
        if (left <= 0) return "경찰이 도착했다";
        const h = Math.floor(left / 60), m = left % 60;
        return `경찰 도착까지 ${h ? h + "시간 " : ""}${m}분`;
    },

    save() {
        try {
            localStorage.setItem(SAVE_KEY, JSON.stringify({
                started: this.started, minute: this.minute, found: this.found,
                presented: this.presented, chats: this.chats, asked: this.asked,
                confessed: this.confessed, answers: this.answers, finished: this.finished
            }));
        } catch (e) { /* 사생활 보호 모드 등 — 저장 없이 진행 */ }
    },

    load() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;
            const d = JSON.parse(raw);
            if (!d || !d.started) return false;
            Object.assign(this, d);
            return true;
        } catch (e) { return false; }
    },

    reset() {
        this.started = false;
        this.minute = CASE.meta.startMinute;
        this.found = []; this.presented = {}; this.chats = {}; this.asked = [];
        this.confessed = false; this.answers = {}; this.finished = false;
        try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }
};

// js/ui.js — 화면 전환, HUD, 눈, 토스트

const UI = {
    show(id) {
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
        const el = document.getElementById("screen-" + id);
        if (el) el.classList.add("active");
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    },

    tab(name) {
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
        document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
        if (name === "notebook") Notebook.render();
    },

    hud() {
        document.getElementById("hud-clock").textContent = State.clock();
        const dl = document.getElementById("hud-deadline");
        dl.textContent = State.remainText();
        dl.classList.toggle("urgent", CASE.meta.endMinute - State.minute <= 90);
        const total = Object.keys(CASE.clues).length;
        document.getElementById("hud-count").textContent = `증거 ${State.found.length} / ${total}`;
    },

    toast(msg, ms) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => { t.hidden = true; }, ms || 2600);
    },

    snow(count) {
        const box = document.getElementById("snow");
        const glyphs = ["❄", "❅", "•", "·"];
        let html = "";
        for (let i = 0; i < (count || 40); i++) {
            const left = Math.random() * 100;
            const dur = 8 + Math.random() * 14;
            const delay = -Math.random() * dur;
            const size = 7 + Math.random() * 11;
            const drift = (Math.random() * 120 - 60).toFixed(0);
            html += `<span style="left:${left}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--drift:${drift}px">${glyphs[i % glyphs.length]}</span>`;
        }
        box.innerHTML = html;
    },

    // 타자기 효과로 한 글자씩 출력
    type(el, text, speed) {
        return new Promise(resolve => {
            el.textContent = "";
            let i = 0;
            const step = () => {
                if (i >= text.length) return resolve();
                el.textContent += text[i++];
                const log = el.closest(".chat-log");
                if (log) log.scrollTop = log.scrollHeight;
                setTimeout(step, speed || 16);
            };
            step();
        });
    }
};


// ============================================================
// js/ai.js — AI 용의자 연결
//
// 세 가지 경로를 순서대로 시도한다.
//   1) Artifact 런타임의 sample 기능 — 설치 없이 페이지가 직접 Claude에게 묻는다
//   2) 로컬 서버(/api/ask) — npm start 로 띄운 경우, 구독 인증을 그대로 쓴다
//   3) 각본 모드 — 둘 다 없으면 case.js 의 미리 쓰인 대사로 진행한다
// ============================================================

const AI = {
    mode: "offline",       // "sample" | "server" | "offline"
    model: null,
    _sample: null,

    get online() { return this.mode !== "offline"; },

    async probe() {
        // 1) Artifact 런타임
        try {
            if (typeof window !== "undefined" && window.claude && window.claude.use) {
                const s = await window.claude.use("sample");
                if (s) {
                    this._sample = s;
                    this.mode = "sample";
                    this.model = "Claude";
                    return true;
                }
            }
        } catch (e) { /* 사용할 수 없으면 다음 경로로 */ }

        // 2) 로컬 서버
        try {
            const r = await fetch("/api/health", { cache: "no-store" });
            if (r.ok) {
                const d = await r.json();
                if (d.ok) { this.mode = "server"; this.model = d.model; return true; }
            }
        } catch (e) { /* 서버 없음 */ }

        this.mode = "offline";
        return false;
    },

    // { text, confessed } 를 반환한다. onText 가 있으면 생성 중에 계속 호출된다.
    async ask(suspectId, message, showing, onText) {
        const history = State.chatFor(suspectId)
            .filter(m => m.role === "user" || m.role === "them")
            .map(m => ({ role: m.role === "user" ? "user" : "assistant", text: m.text }));
        const presented = State.presentedFor(suspectId);

        if (this.mode === "sample") return this._viaSample(suspectId, message, showing, history, presented, onText);
        return this._viaServer(suspectId, message, showing, history, presented);
    },

    async _viaSample(suspectId, message, showing, history, presented, onText) {
        const system = buildSystemPrompt(suspectId, presented, pressureLabel(presented));
        const user = buildUserPrompt({ history, message, showing });

        const res = await this._sample(
            [{ role: "user", content: system + "\n\n──────────\n\n" + user }],
            {
                cache: false,
                modelTier: suspectId === "bae" ? "complex" : "default",
                onText: onText ? (e => onText(this._clean(e.text))) : undefined
            }
        );
        return this._finish(res.text);
    },

    async _viaServer(suspectId, message, showing, history, presented) {
        const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ suspect: suspectId, message, showing: showing || null, presented, history })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "응답 실패");
        return { text: data.text, confessed: data.confessed };
    },

    _clean(t) { return String(t || "").replace(/\[\[자백\]\]/g, "").trim(); },

    _finish(raw) {
        const text = String(raw || "").trim();
        return { text: this._clean(text), confessed: text.includes("[[자백]]") };
    },

    // 오류 코드를 사람이 읽을 수 있는 말로
    explain(e) {
        const code = e && e.code;
        if (code === "not_granted") return "심문 권한이 허용되지 않았습니다.";
        if (code === "rate_limited") return "요청이 몰렸습니다. 잠시 뒤 다시 물어보십시오.";
        if (code === "cancelled") return "질문이 취소되었습니다.";
        return (e && e.message) || "응답을 받지 못했습니다.";
    }
};

// js/investigate.js — 현장 조사

const Investigate = {
    current: null,

    renderLocations() {
        const grid = document.getElementById("loc-grid");
        grid.innerHTML = CASE.locations.map(loc => {
            const total = loc.clues.length;
            const got = loc.clues.filter(c => State.has(c)).length;
            const done = got === total;
            return `<button class="loc-card" data-loc="${loc.id}">
                <span class="loc-icon">${loc.icon}</span>
                <b>${loc.name}</b>
                <span class="loc-prog ${done ? "done" : ""}">${done ? "조사 완료" : `단서 ${got} / ${total}`}</span>
            </button>`;
        }).join("");

        grid.querySelectorAll(".loc-card").forEach(b => {
            b.onclick = () => this.open(b.dataset.loc);
        });

        document.getElementById("loc-grid").hidden = false;
        document.getElementById("loc-detail").hidden = true;
    },

    open(id) {
        this.current = CASE.locations.find(l => l.id === id);
        if (!this.current) return;
        document.getElementById("loc-grid").hidden = true;
        document.getElementById("loc-detail").hidden = false;
        document.getElementById("loc-name").textContent = this.current.icon + "  " + this.current.name;
        document.getElementById("loc-desc").textContent = this.current.desc;
        this.renderClues();
    },

    renderClues() {
        const box = document.getElementById("clue-list");
        box.innerHTML = this.current.clues.map(id => {
            const c = CASE.clues[id];
            if (State.has(id)) {
                return `<div class="clue ${c.key ? "key" : ""}">
                    <div class="clue-head">
                        <span>${c.icon}</span><b>${c.name}</b>
                        <span class="clue-tag ${c.tag}">${c.tag}</span>
                    </div>
                    <p class="clue-text">${c.text}</p>
                </div>`;
            }
            const ok = State.canFind(id);
            const need = ok ? "" : `<div class="clue-hint">먼저 ${c.requires.map(r => "「" + CASE.clues[r].name + "」").join(", ")}을(를) 확인해야 한다.</div>`;
            return `<div class="clue locked">
                <div class="clue-undiscovered">
                    <span>${ok ? "아직 살펴보지 않은 곳이 있다." : "지금은 의미를 알 수 없다."}</span>
                    <button class="btn btn-small" data-find="${id}" ${ok ? "" : "disabled"}>조사한다</button>
                </div>${need}
            </div>`;
        }).join("");

        box.querySelectorAll("[data-find]").forEach(b => {
            b.onclick = () => this.examine(b.dataset.find);
        });
    },

    examine(id) {
        if (State.timeUp()) return Accuse.forceEnd();
        const c = CASE.clues[id];
        if (!State.find(id)) return;
        UI.hud();
        this.renderClues();
        UI.toast(`${c.icon} 「${c.name}」 — ${c.short}`, 3600);
        if (State.timeUp()) setTimeout(() => Accuse.forceEnd(), 1200);
    }
};

// js/interrogate.js — 용의자 심문
// AI 서버가 있으면 자유 대화, 없으면 각본 대사로 진행한다.
// ============================================================

const Interrogate = {
    current: null,
    busy: false,

    renderSuspects() {
        const grid = document.getElementById("sus-grid");
        grid.innerHTML = CASE.suspects.map(s => {
            const turns = (State.chats[s.id] || []).filter(m => m.role === "user").length;
            const shown = (State.presented[s.id] || []).length;
            return `<button class="sus-card" data-sus="${s.id}">
                <span class="sus-face">${s.face}</span>
                <span>
                    <b>${s.name} <small style="display:inline">(${s.age})</small></b>
                    <small>${s.role}</small>
                    <span class="sus-meta">질문 ${turns}회 · 증거 제시 ${shown}건</span>
                </span>
            </button>`;
        }).join("");

        grid.querySelectorAll(".sus-card").forEach(b => {
            b.onclick = () => this.open(b.dataset.sus);
        });

        grid.hidden = false;
        document.getElementById("chat-wrap").hidden = true;
    },

    open(id) {
        this.current = CASE.suspects.find(s => s.id === id);
        if (!this.current) return;

        document.getElementById("sus-grid").hidden = true;
        document.getElementById("chat-wrap").hidden = false;
        document.getElementById("chat-face").textContent = this.current.face;
        document.getElementById("chat-name").textContent = this.current.name;
        document.getElementById("chat-role").textContent = this.current.role;

        const log = State.chatFor(id);
        if (!log.length) {
            log.push({ role: "system", text: this.current.profile });
            State.save();
        }
        this.renderLog();
        this.renderChips();
        document.getElementById("chat-text").focus();
    },

    renderLog() {
        const box = document.getElementById("chat-log");
        box.innerHTML = State.chatFor(this.current.id).map(m => {
            if (m.role === "system") return `<div class="msg system">${m.text}</div>`;
            if (m.role === "evidence") return `<div class="msg evidence">📎 「${m.text}」을(를) 내밀었다</div>`;
            if (m.role === "user") return `<div class="msg me">${this.esc(m.text)}</div>`;
            return `<div class="msg them ${m.confess ? "confess" : ""}">${this.esc(m.text)}</div>`;
        }).join("");
        box.scrollTop = box.scrollHeight;
    },

    // 아직 알 리 없는 사실을 전제하는 질문은 내놓지 않는다.
    // 본인이 먼저 흘렸거나(after), 해당 증거를 확보했을 때(needs)만 열린다.
    chipOpen(t) {
        if (State.asked.includes(t.id)) return false;
        if (!t.after && !t.needs) return true;
        if (t.after && State.asked.includes(t.after)) return true;
        if (t.needs && t.needs.some(c => State.has(c))) return true;
        return false;
    },

    renderChips() {
        const box = document.getElementById("chat-chips");
        const topics = (this.current.topics || []).filter(t => this.chipOpen(t));
        box.innerHTML = topics.slice(0, 3)
            .map(t => `<button class="chip" data-topic="${t.id}">${t.q}</button>`).join("");
        box.querySelectorAll("[data-topic]").forEach(b => {
            b.onclick = () => {
                const t = this.current.topics.find(x => x.id === b.dataset.topic);
                if (AI.online) {
                    if (!State.asked.includes(t.id)) { State.asked.push(t.id); State.save(); }
                    document.getElementById("chat-text").value = t.q;
                    this.send();
                } else {
                    this.scriptedTopic(t);
                }
            };
        });
    },

    esc(s) {
        return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    },

    push(role, text, extra) {
        State.chatFor(this.current.id).push(Object.assign({ role, text }, extra || {}));
        State.save();
        this.renderLog();
    },

    // ── AI 대화 ────────────────────────────────────────
    async send(showing) {
        if (this.busy) return;
        if (State.timeUp()) return Accuse.forceEnd();

        const input = document.getElementById("chat-text");
        const text = (input.value || "").trim();
        if (!text && !showing) return;
        input.value = "";

        if (!AI.online) return this.offlineReply(text);

        this.push("user", text || "이건 어떻게 설명하시겠습니까?");
        this.busy = true;
        this.setBusy(true);

        const box = document.getElementById("chat-log");
        const wait = document.createElement("div");
        wait.className = "msg them thinking";
        wait.textContent = `${this.current.name}이(가) 생각하고 있다…`;
        box.appendChild(wait);
        box.scrollTop = box.scrollHeight;

        let el = null, streamed = false;
        const stream = t => {
            if (!t) return;
            if (!el) {
                wait.remove();
                el = document.createElement("div");
                el.className = "msg them";
                box.appendChild(el);
            }
            streamed = true;
            el.textContent = t;
            box.scrollTop = box.scrollHeight;
        };

        try {
            const res = await AI.ask(this.current.id, text, showing, stream);
            wait.remove();

            State.spend();
            UI.hud();

            if (!el) {
                el = document.createElement("div");
                el.className = "msg them";
                box.appendChild(el);
            }
            if (res.confessed) el.classList.add("confess");
            if (streamed) { el.textContent = res.text; box.scrollTop = box.scrollHeight; }
            else await UI.type(el, res.text, 15);

            State.chatFor(this.current.id).push({ role: "them", text: res.text, confess: res.confessed });
            if (res.confessed && !State.confessed) {
                State.confessed = true;
                UI.toast("배정훈이 무너졌다. 최종 추리를 진술할 수 있다.", 5000);
            }
            State.save();
            this.renderChips();
            if (State.timeUp()) setTimeout(() => Accuse.forceEnd(), 1500);
        } catch (e) {
            wait.remove();
            if (el) el.remove();
            this.push("system", "⚠ " + AI.explain(e));
            if (!e || e.code !== "rate_limited") {
                AI.mode = "offline";
                this.push("system", "각본 모드로 전환합니다. 아래 질문 버튼을 사용하십시오.");
            }
            this.renderChips();
        } finally {
            this.busy = false;
            this.setBusy(false);
        }
    },

    setBusy(on) {
        document.getElementById("btn-chat-send").disabled = on;
        document.getElementById("btn-show-evidence").disabled = on;
        document.getElementById("chat-text").disabled = on;
        if (!on) document.getElementById("chat-text").focus();
    },

    // ── 각본 모드 ──────────────────────────────────────
    offlineReply(text) {
        if (text) this.push("user", text);
        this.push("them", "…무슨 말씀이신지 모르겠군요. 물으실 게 있으면 정확히 물어 주십시오.");
    },

    scriptedTopic(t) {
        if (State.timeUp()) return Accuse.forceEnd();
        this.push("user", t.q);
        if (!State.asked.includes(t.id)) {
            State.asked.push(t.id);
            State.spend();
            UI.hud();
        }
        this.push("them", t.a);
        this.renderChips();
        if (State.timeUp()) setTimeout(() => Accuse.forceEnd(), 1200);
    },

    // ── 증거 제시 ──────────────────────────────────────
    openEvidenceModal() {
        const modal = document.getElementById("modal-evidence");
        const list = document.getElementById("modal-evidence-list");
        const shown = State.presentedFor(this.current.id);
        const items = State.found.filter(id => !shown.includes(id));

        if (!items.length) {
            list.innerHTML = `<p class="nb-empty">${State.found.length ? "이 사람에게는 가진 증거를 모두 보여줬다." : "아직 내밀 증거가 없다. 먼저 현장을 조사하십시오."}</p>`;
        } else {
            list.innerHTML = items.map(id => {
                const c = CASE.clues[id];
                return `<button class="modal-item" data-ev="${id}">${c.icon} ${c.name}<small>${c.short}</small></button>`;
            }).join("");
            list.querySelectorAll("[data-ev]").forEach(b => {
                b.onclick = () => { modal.hidden = true; this.present(b.dataset.ev); };
            });
        }
        modal.hidden = false;
    },

    present(cid) {
        const c = CASE.clues[cid];
        State.present(this.current.id, cid);
        this.push("evidence", c.name);

        if (AI.online) {
            this.send(cid);
            return;
        }

        // 각본 모드: 미리 쓰인 반응이 있으면 그것을, 없으면 일반 반응을
        const r = (this.current.reactions || {})[cid];
        if (State.timeUp()) return Accuse.forceEnd();
        State.spend();
        UI.hud();
        if (r) {
            this.push("them", r.text);
            if (r.unlock === "break_4") {
                State.confessed = true;
                UI.toast("배정훈의 진술이 무너지고 있다.", 4000);
            }
        } else {
            this.push("them", "…글쎄요. 저는 그것에 대해 아는 바가 없습니다.");
        }
        State.save();
    }
};


// ============================================================
// js/notebook.js — 사건 수첩
// ============================================================

const Notebook = {
    view: "evidence",

    // 그 사람에게서 실제로 답을 들었는가
    heard(sid) {
        return (State.chats[sid] || []).some(m => m.role === "them");
    },

    render() {
        const box = document.getElementById("nb-body");
        document.querySelectorAll(".nb-tab").forEach(t => t.classList.toggle("active", t.dataset.nb === this.view));
        box.innerHTML = this[this.view]();
    },

    evidence() {
        if (!State.found.length) return `<p class="nb-empty">아직 아무것도 찾지 못했다.</p>`;
        const order = ["결정적", "현장", "흉기", "동기", "알리바이", "동선"];
        const groups = {};
        State.found.forEach(id => {
            const c = CASE.clues[id];
            (groups[c.tag] = groups[c.tag] || []).push(c);
        });
        return order.filter(t => groups[t]).map(tag => `
            <div class="nb-group">
                <h3>${tag}</h3>
                ${groups[tag].map(c => `<div class="clue ${c.key ? "key" : ""}">
                    <div class="clue-head"><span>${c.icon}</span><b>${c.name}</b></div>
                    <p class="clue-text">${c.text}</p>
                </div>`).join("")}
            </div>`).join("");
    },

    people() {
        return CASE.suspects.map(s => {
            const shown = (State.presented[s.id] || []).length;
            const turns = (State.chats[s.id] || []).filter(m => m.role === "user").length;
            return `<div class="nb-group">
                <h3>${s.face} ${s.name} (${s.age}) — ${s.role}</h3>
                <p class="clue-text">${s.profile}</p>
                <p class="clue-hint">질문 ${turns}회 · 증거 제시 ${shown}건</p>
            </div>`;
        }).join("");
    },

    time() {
        // 확보한 증거·증언으로만 채워지는 타임라인
        const rows = [
            { t: "20:30", w: "윤태오가 윤제하와 작업실에 있었다. 벽시계는 멀쩡했다.", talk: "yun" },
            { t: "22:30", w: "한소민이 작업실에서 윤제하와 다퉜다.", talk: "han" },
            { t: "23:00", w: "배정훈과 윤태오가 거실에서 술자리를 시작했다.", need: "c_bottle", talk: "bae" },
            { t: "23:00–23:50", w: "오만춘이 보일러실에서 순환펌프를 고쳤다.", need: "c_boilerlog" },
            { t: "23:20–00:00", w: "서가을이 진입로 끝에 나가 있었다. 돌아오며 오만춘과 마주쳤다.", talk: "seo" },
            { t: "23:40", w: "벽시계가 멈춘 것으로 되어 있는 시각. — 조작된 시각이다.", need: "c_clock_trick" },
            { t: "23:50", w: "배정훈이 방으로 올라갔다고 진술한 시각. 이후 목격자 없음.", talk: "bae" },
            { t: "00:10", w: "한소민과 서가을이 주방에 앉았다. 거실이 보이는 자리다.", need: "c_teacups", talk: "han" },
            { t: "00:10–01:10", w: "오만춘이 제설기로 진입로를 쳤다.", need: "c_plow", talk: "oh" },
            { t: "00:12", w: "윤제하가 미술관에 문자를 보냈다. 이때까지 살아 있었다.", need: "c_phone" },
            { t: "00:45", w: "2층 작업실 불이 꺼졌다. — 범행 시각의 상한선.", talk: "oh" },
            { t: "07:10", w: "한소민이 시신을 발견했다.", need: "c_body" }
        ].filter(r => (!r.need || State.has(r.need)) && (!r.talk || this.heard(r.talk)));

        if (!rows.length) return `<p class="nb-empty">타임라인을 채우려면 증거가 더 필요하다.</p>`;

        const head = State.has("c_phone") && this.heard("oh")
            ? `<p class="clue-hint" style="margin-bottom:14px">확정된 범행 가능 시간대: <b>00:12 – 00:45</b>. 이 시간에 알리바이가 없는 사람은 한 명뿐이다.</p>`
            : "";

        return head + rows.map(r => `<div class="tl-row"><span class="tl-time">${r.t}</span><span class="tl-what">${r.w}</span></div>`).join("");
    }
};


// ============================================================
// js/accuse.js — 최종 추리와 엔딩
// ============================================================

const Accuse = {
    open() {
        const box = document.getElementById("quiz-list");
        box.innerHTML = CASE.quiz.map((q, qi) => `
            <div class="quiz">
                <h3>${qi + 1}. ${q.q}</h3>
                ${q.options.map((o, oi) => `
                    <label><input type="radio" name="${q.id}" value="${oi}"> <span>${o}</span></label>
                `).join("")}
            </div>`).join("");
        UI.show("accuse");
    },

    forceEnd() {
        if (State.finished) return;
        UI.toast("오후 3시. 경찰이 도착했다.", 4000);
        setTimeout(() => this.open(), 900);
    },

    submit() {
        const missing = [];
        CASE.quiz.forEach(q => {
            const sel = document.querySelector(`input[name="${q.id}"]:checked`);
            if (!sel) missing.push(q.q);
            else State.answers[q.id] = Number(sel.value);
        });
        if (missing.length) return UI.toast("아직 답하지 않은 항목이 있습니다.", 3000);

        let score = 0, max = 0;
        const marks = CASE.quiz.map(q => {
            max += q.weight;
            const picked = State.answers[q.id];
            const ok = picked === q.answer;
            if (ok) score += q.weight;
            return { q, picked, ok };
        });

        // 증거 수집률 보너스는 등급 판정에만 반영
        const rate = State.found.length / Object.keys(CASE.clues).length;
        const total = Math.round(score + rate * 0);   // 정답 자체로만 채점
        const rank = CASE.ranks.find(r => total >= r.min) || CASE.ranks[CASE.ranks.length - 1];

        State.finished = true;
        State.save();
        this.ending(marks, total, max, rank, rate);
    },

    ending(marks, total, max, rank, rate) {
        document.getElementById("rank-grade").textContent = rank.grade;
        document.getElementById("rank-title").textContent = rank.title;
        document.getElementById("rank-score").textContent =
            `${total} / ${max}점 · 증거 ${State.found.length}/${Object.keys(CASE.clues).length}개 수집 (${Math.round(rate * 100)}%) · 종료 시각 ${State.clock()}`;
        document.getElementById("rank-line").textContent = rank.line;

        document.getElementById("ending-marks").innerHTML = marks.map(m => `
            <div class="mark">
                <span class="mark-icon">${m.ok ? "✔" : "✘"}</span>
                <div>
                    <div class="mark-q">${m.q.q}</div>
                    <div class="mark-a ${m.ok ? "" : "wrong"}">당신의 답: ${m.q.options[m.picked]}</div>
                    ${m.ok ? "" : `<div class="mark-a">정답: ${m.q.options[m.q.answer]}</div>`}
                    <div class="mark-exp">${m.q.explain}</div>
                </div>
            </div>`).join("");

        document.getElementById("solution-body").innerHTML = CASE.solution.map(s =>
            `<div class="sol-block"><h3>${s.head}</h3><p>${s.body}</p></div>`).join("");

        UI.show("ending");
    }
};


// ============================================================
// js/main.js — 초기화와 화면 배선
// ============================================================

let prologueIndex = 0;

function showPrologue(i) {
    const p = CASE.prologue[i];
    if (!p) return startGame();
    document.getElementById("prologue-head").textContent = p.head;
    document.getElementById("prologue-body").innerHTML = p.body;
    document.getElementById("prologue-dots").textContent =
        CASE.prologue.map((_, k) => (k === i ? "●" : "○")).join(" ");
    document.getElementById("btn-prologue-next").textContent =
        (i === CASE.prologue.length - 1) ? "조사에 들어간다" : "다음";
    UI.show("prologue");
}

function startGame() {
    State.started = true;
    State.save();
    UI.hud();
    Investigate.renderLocations();
    Interrogate.renderSuspects();
    UI.tab("investigate");
    UI.show("game");
}

function boot() {
    UI.snow(45);
    document.title = CASE.meta.title;

    // 이어서 하기
    const hasSave = State.load();
    if (hasSave && !State.finished) {
        document.getElementById("btn-continue").hidden = false;
    }

    // AI 서버 확인
    const status = document.getElementById("ai-status");
    AI.probe().then(() => {
        if (AI.mode === "sample") {
            status.className = "ai-status ok";
            status.innerHTML = `● 다섯 용의자를 Claude가 연기합니다 — 무엇이든 자유롭게 물어보십시오.`;
        } else if (AI.mode === "server") {
            status.className = "ai-status ok";
            status.innerHTML = `● 용의자 AI 연결됨 (${AI.model}) — 무엇이든 자유롭게 물어보십시오.`;
        } else {
            const inArtifact = typeof window !== "undefined" && window.claude && window.claude.use;
            status.className = "ai-status off";
            status.innerHTML = inArtifact
                ? `○ 각본 모드 — 준비된 질문으로만 진행됩니다. 자유 심문은 지금 이 화면에서 쓸 수 없습니다.`
                : `○ 각본 모드 — 준비된 질문으로만 진행됩니다.<br>자유 심문을 켜려면 터미널에서 <b>npm start</b> 후 표시된 주소로 접속하십시오.`;
        }
    });

    // 타이틀
    document.getElementById("btn-start").onclick = () => {
        State.reset();
        prologueIndex = 0;
        showPrologue(0);
    };
    document.getElementById("btn-continue").onclick = () => startGame();

    // 프롤로그
    document.getElementById("btn-prologue-next").onclick = () => showPrologue(++prologueIndex);

    // 탭
    document.querySelectorAll(".tab").forEach(t => {
        t.onclick = () => UI.tab(t.dataset.tab);
    });
    document.querySelectorAll(".nb-tab").forEach(t => {
        t.onclick = () => { Notebook.view = t.dataset.nb; Notebook.render(); };
    });

    // 현장 조사
    document.getElementById("btn-loc-back").onclick = () => Investigate.renderLocations();

    // 심문
    document.getElementById("btn-chat-back").onclick = () => Interrogate.renderSuspects();
    document.getElementById("btn-chat-send").onclick = () => Interrogate.send();
    document.getElementById("chat-text").addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing) Interrogate.send();
    });
    document.getElementById("btn-show-evidence").onclick = () => Interrogate.openEvidenceModal();

    // 최종 추리
    document.getElementById("btn-goto-accuse").onclick = () => Accuse.open();
    document.getElementById("btn-accuse-back").onclick = () => UI.show("game");
    document.getElementById("btn-accuse-submit").onclick = () => Accuse.submit();
    document.getElementById("btn-replay").onclick = () => { State.reset(); location.reload(); };
}

document.addEventListener("DOMContentLoaded", boot);

</script>
